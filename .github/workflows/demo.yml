# Builds the public London demo from live open data with the same code a real installation runs,
# and publishes a read-only snapshot of the console to GitHub Pages.
#
# One-time setup (repository Settings): Pages > Build and deployment > Source: GitHub Actions.
# Data: Thames Water storm overflows via Stream (CC BY 4.0) and Environment Agency rainfall
# (Open Government Licence v3). Map: OpenStreetMap.
name: Demo
# Third-party steps are pinned to exact commits (tags can be moved); the comment shows the version.

on:
  schedule:
    - cron: "17 */3 * * *"     # London's overflow and rain feeds are live: refresh every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "waterworks_desk/**", "tools/**", ".github/workflows/demo.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install pytest
          python -m pytest tests -q --ignore=tests/test_ui.py

      # Stream gives each overflow's latest spill only, so the database is carried from run to
      # run (GitHub keeps caches 7 days after last use) to build up months of spill history.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: demo
          key: demo-db-${{ github.run_id }}
          restore-keys: demo-db-

      - name: Build the demo from London's live feeds
        run: python -u tools/build_demo.py --out site --keep

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: demo
          key: demo-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
