# Builds the public L-Town demo with the same code a real installation runs, and publishes a
# read-only snapshot of the console to GitHub Pages.
#
# One-time setup (repository Settings): Pages > Build and deployment > Source: GitHub Actions.
# Data: BattLeDIM (Zenodo 10.5281/zenodo.4017659, CC BY 4.0) and Open-Meteo (CC BY 4.0).
name: Demo
# Third-party steps are pinned to exact commits (tags can be moved); the comment shows the version.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "waterworks_desk/**", "tools/**", ".github/workflows/demo.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install pytest
          python -m pytest tests -q --ignore=tests/test_ui.py

      - name: Restore the BattLeDIM files
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: data/battledim
          key: battledim-v1

      - name: Download the BattLeDIM files from Zenodo (first run only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/battledim && cd data/battledim
          for f in L-TOWN.inp 2018_SCADA_Flows.csv 2018_SCADA_Levels.csv 2018_SCADA_Pressures.csv \
                   2019_SCADA_Flows.csv 2019_SCADA_Levels.csv 2019_SCADA_Pressures.csv; do
            curl -fsSL --retry 4 -o "$f" "https://zenodo.org/records/4017659/files/$f?download=1"
          done
          md5sum -c <<'SUMS'
          bfbb16b8b463e0576200ba6ad360f68e  L-TOWN.inp
          d0602c06946b46287e956f007e4264ee  2018_SCADA_Flows.csv
          92a512d6749ddf66fd6d99f2bdde6cc4  2018_SCADA_Levels.csv
          d389d8541350c19ff0bfc6b80f246d35  2018_SCADA_Pressures.csv
          28fc99fdcbf80fcd26079e7fe602d6dc  2019_SCADA_Flows.csv
          e5a8050bd38729e4b7648b9d52abd5b1  2019_SCADA_Levels.csv
          5ea1e46d3f2f0a89a3f98d6fd39a851d  2019_SCADA_Pressures.csv
          SUMS

      - name: Build the demo
        run: |
          python -u tools/build_demo.py --data data/battledim --out site \
            || { echo "::warning::Weather fetch failed; building without it"; python -u tools/build_demo.py --data data/battledim --out site --no-weather; }

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
