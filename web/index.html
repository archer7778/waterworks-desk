<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waterworks Desk</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Waterworks Desk console. Palette and habits from Downlink Desk; system fonts so it works offline. */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --sunk:#f1f4f7; --ink:#15212c; --muted:#5b6b79; --line:#d2dae1;
  --accent:#1f5fa8; --accent-ink:#fff; --accent-bg:#e1ebf7;
  --ok:#1d7f53; --warn:#a86c10; --crit:#bf3227; --adv:#4a5fb0; --stale:#7f8c99;
  --ok-bg:#e1f2e9; --warn-bg:#fbefd9; --crit-bg:#fbe3e0; --adv-bg:#e6e9f8; --stale-bg:#e7ebef;
  --water:#3b82c4; --water-bg:#cfe2f5; --earth:#b9a58a;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c131a; --panel:#121c26; --sunk:#0f1820; --ink:#d9e3eb; --muted:#8fa0b0; --line:#243342;
  --accent:#7aa8ff; --accent-ink:#0c131a; --accent-bg:#17284a;
  --ok:#43c088; --warn:#e3a840; --crit:#f2675c; --adv:#9aa8ff; --stale:#6c7b8a;
  --ok-bg:#12301f; --warn-bg:#33270f; --crit-bg:#3a1714; --adv-bg:#1d2246; --stale-bg:#1a2531;
  --water:#5ea3e6; --water-bg:#163049; --earth:#6b5d4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131a; --panel:#121c26; --sunk:#0f1820; --ink:#d9e3eb; --muted:#8fa0b0; --line:#243342;
  --accent:#7aa8ff; --accent-ink:#0c131a; --accent-bg:#17284a;
  --ok:#43c088; --warn:#e3a840; --crit:#f2675c; --adv:#9aa8ff; --stale:#6c7b8a;
  --ok-bg:#12301f; --warn-bg:#33270f; --crit-bg:#3a1714; --adv-bg:#1d2246; --stale-bg:#1a2531;
  --water:#5ea3e6; --water-bg:#163049; --earth:#6b5d4b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
h1{font-size:19px;margin:0;font-weight:650}
h2{font-size:16px;margin:0 0 8px;font-weight:650}
h3{font-size:14px;margin:14px 0 6px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.banner{padding:8px 16px;font-size:14px;border-bottom:1px solid var(--line);background:var(--adv-bg)}
.banner.safety{background:var(--sunk);color:var(--muted);font-size:13px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .brand{display:flex;align-items:center;gap:10px}
header.top .brand svg{flex:none}
nav.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;flex:none;border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--accent-bg);color:var(--accent)}
.grow{flex:1}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who input{width:150px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-height:34px}
textarea{width:100%;min-height:60px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;min-height:34px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 9px;min-height:28px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1500px;margin:0 auto;padding:14px 16px 48px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid-ov{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid-ov{grid-template-columns:1fr}}
#map{height:min(68vh,640px);border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
#map.blank{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:650;border:1px solid}
.chip.critical{color:var(--crit);background:var(--crit-bg);border-color:var(--crit)}
.chip.warning{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.chip.advisory{color:var(--adv);background:var(--adv-bg);border-color:var(--adv)}
.chip.ok,.chip.live{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.chip.draft,.chip.retired{color:var(--stale);background:var(--stale-bg);border-color:var(--stale)}
.alert{border:1px solid var(--line);border-left:5px solid var(--stale);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.alert.critical{border-left-color:var(--crit)} .alert.warning{border-left-color:var(--warn)} .alert.advisory{border-left-color:var(--adv)}
.alert.ended{opacity:.7}
.alert .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.alert p{margin:4px 0 6px}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap}
.leaflet-container{font:inherit}
.site-icon{background:none;border:0}
.wwd-pipe{stroke:var(--water);stroke-opacity:.5;fill:none}
.wwd-boundary{stroke:var(--muted);stroke-dasharray:4 4;fill:var(--water);fill-opacity:.04}
.leaflet-tooltip.site-label{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:1px 6px;font-size:12px;font-weight:600}
.leaflet-tooltip.site-label::before{display:none}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-control-attribution,.leaflet-control-scale-line{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--accent)}
.leaflet-control-scale-line{border-color:var(--muted)}
.leaflet-tooltip{font-size:13px}
.site-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.grid-site{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid-site{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:650}
th button.sort{all:unset;cursor:pointer}th button.sort:focus-visible{outline:2px solid var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
tr.pick{cursor:pointer} tr.pick:hover{background:var(--sunk)} tr.sel{background:var(--accent-bg)}
.val{font-size:17px;font-weight:650}
.chart svg{width:100%;height:auto;display:block}
.ranges{display:flex;gap:4px;flex-wrap:wrap}
.ranges button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree ul{list-style:none;padding-left:18px;margin:4px 0}
.tree>ul{padding-left:0}
.tree li{margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,18,26,.5)}
dialog form{padding:16px 18px}
dialog .dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.field.wide{grid-column:1/-1}
.height{display:flex;flex-wrap:wrap;gap:6px}.height input{width:96px;flex:none}.height select{flex:1 1 120px;min-width:0;max-width:100%}
.problems{border:1px solid var(--crit);background:var(--crit-bg);border-radius:8px;padding:8px 12px;margin:10px 0}
.problems.warn{border-color:var(--warn);background:var(--warn-bg)}
.problems ul{margin:4px 0;padding-left:18px}
#pickmap{height:220px;border-radius:8px;border:1px solid var(--line)}
.sketch svg{width:100%;max-width:300px;height:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;z-index:2000;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.filters{margin:4px 0 12px}.filters input[type=search]{flex:1 1 220px;min-width:0;max-width:340px}.filters select{max-width:100%}
table.list td.what{min-width:260px;max-width:560px}
.find{position:relative;flex:0 1 280px;min-width:180px}.find input{width:100%}
#findList{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:1500;padding:4px;max-height:60vh;overflow:auto}
#findList button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:7px;cursor:pointer}
#findList button[aria-selected="true"],#findList button:hover{background:var(--accent-bg)}
.stack{position:relative;width:24px;height:24px}.stack b{position:absolute;right:-7px;top:-7px;background:var(--ink);color:var(--bg);border-radius:9px;font-size:10px;line-height:1;padding:2px 4px;font-weight:700}
.here{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}.here li{margin:2px 0}.here button{all:unset;cursor:pointer;color:var(--accent);display:flex;gap:6px;align-items:center}
.here button:hover{text-decoration:underline}
details.sys>summary{cursor:pointer;color:var(--muted);font-size:13px;margin:4px 0}
.more-link{margin-top:6px}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="demo" class="banner" hidden></div>
<div class="banner safety" data-t="safety"></div>
<header class="top">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3c4 5.5 7.5 9.4 7.5 13.3A7.5 7.5 0 0 1 6.5 16.3C6.5 12.4 10 8.5 14 3z" fill="var(--water)"/><path d="M10 17.5a4 4 0 0 0 4 4" stroke="var(--panel)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    <h1 id="title">Waterworks Desk</h1>
  </div>
  <nav class="tabs" aria-label="Views">
    <button data-view="overview" data-t="nav.overview"></button>
    <button data-view="alerts" data-t="nav.alerts"></button>
    <button data-view="sites" data-t="nav.sites"></button>
    <button data-view="spills" data-t="nav.spills"></button>
    <button data-view="setup" data-t="nav.setup"></button>
    <button data-view="log" data-t="nav.log"></button>
  </nav>
  <label class="row small"><span data-t="sys.pick"></span> <select id="sysPick" aria-label="System"></select></label>
  <div class="find"><input id="find" type="search" autocomplete="off" role="combobox" aria-controls="findList" aria-expanded="false"><div id="findList" role="listbox" hidden></div></div>
  <span class="grow"></span>
  <span id="clock" class="small muted"></span>
  <div class="who">
    <input id="you" autocomplete="name" aria-label="Your name">
    <input id="pass" type="password" autocomplete="current-password" aria-label="Passcode" hidden>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
  </div>
</header>

<main>
  <section id="v-overview" hidden>
    <div class="grid-ov">
      <div class="panel">
        <div class="filters row"><input type="search" id="mapQ" aria-label="Search"><select id="mapShow" aria-label="Show"></select><select id="mapType" aria-label="Site type"></select><span class="grow"></span><span class="small muted" id="mapCount" aria-live="polite"></span></div>
        <div id="map" role="application" aria-label="Map of sites"></div>
        <div class="legend" id="legend"></div>
        <div class="small muted" id="rain24"></div>
      </div>
      <div>
        <div class="panel">
          <div class="row"><h2 data-t="ov.alerts"></h2><span class="grow"></span><button class="btn small" id="allAlerts"></button></div>
          <div class="counts" id="counts"></div>
          <div id="alerts"></div>
          <details><summary class="small muted" id="recentHead"></summary><div id="recent" style="margin-top:8px"></div></details>
        </div>
      </div>
    </div>
  </section>

  <section id="v-site" hidden></section>
  <section id="v-alerts" hidden></section>
  <section id="v-sites" hidden></section>
  <section id="v-spills" hidden></section>
  <section id="v-setup" hidden></section>
  <section id="v-log" hidden></section>
  <div class="foot" id="foot"></div>
</main>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ST=window.WWD_STATIC||null;
const prefs=lsGet("wwd.prefs",{});
let LANG=prefs.lang||null, I18N={}, I18N_EN={}, CONF=null, TREE=null, SYS=prefs.sys||"", VIEW="overview", SITE=null;
let PREV="overview", MAPDATA=null, ALERTS=[], RECENT=[], map=null, markers=null, lines=null, CHART={sensor:null,range:"7d"}, SITEDATA=null;

/* ---------- words ---------- */
function t(k,p){let s=I18N[k]??I18N_EN[k]??k;if(p)s=s.replace(/\{(\w+)\}/g,(m,n)=>p[n]!=null?p[n]:m);return s}
function applyWords(){$$("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));$("#you").placeholder=t("you.name");$("#pass").placeholder=t("you.passcode");document.documentElement.lang=LANG}
async function loadLang(l){
  const get=async x=>{const r=await fetch((ST?ST.base.replace(/api\/$/,""):"")+"i18n/"+x+".json",{cache:"no-cache"});return r.json()};
  if(!Object.keys(I18N_EN).length)I18N_EN=await get("en");
  I18N=l==="en"?I18N_EN:await get(l);LANG=l;
}

/* ---------- server ---------- */
function staticFile(path){
  const [base,qs]=path.split("?"),q=new URLSearchParams(qs||""),n=base.replace(/^\/api\//,"");
  if(n==="alerts")return "alerts";
  if(n==="spills")return "spills-"+(q.get("days")??"30");
  if(n.startsWith("sensors/")){const key=n.split("/")[1],from=+q.get("from"),to=+q.get("to"),span=to-from;
    return {sensor:key,file:span<=8*86400?"raw":span<=95*86400?"3600":"86400",from,to}}
  if(n==="setup/item")return null;
  return n;
}
async function staticApi(path,opts){
  if(opts&&opts.method==="POST"){const e=new Error(t("m.readonly"));e.status=403;throw e}
  const f=staticFile(path);if(!f){const e=new Error(t("m.readonly"));e.status=404;throw e}
  if(typeof f==="object"){
    const r=await fetch(ST.base+"sensors/"+encodeURIComponent(f.sensor)+"/"+f.file+".json",{cache:"no-cache"});
    if(!r.ok)return {t:[],v:[],res:f.file};
    const j=await r.json(),keep=j.t.map((x,i)=>x>=f.from&&x<=f.to?i:-1).filter(i=>i>=0);
    const out={...j,from:f.from,to:f.to};for(const k of ["t","v","lo","hi","n","q"])if(j[k])out[k]=keep.map(i=>j[k][i]);return out;
  }
  const r=await fetch(ST.base+f+".json",{cache:"no-cache"});
  if(!r.ok){const e=new Error("Not in this snapshot");e.status=404;throw e}
  return r.json();
}
async function api(path,opts){
  if(ST)return staticApi(path,opts);
  const o=Object.assign({headers:{}},opts||{});
  if(o.body&&typeof o.body!=="string"){o.body=JSON.stringify(o.body);o.headers["Content-Type"]="application/json"}
  const pass=$("#pass").value;if(pass)o.headers["X-Passcode"]=pass;
  const r=await fetch(path,o);const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||("HTTP "+r.status));e.status=r.status;e.body=j;throw e}
  return j;
}
function actor(){const d=$("#dlg_you");if(d&&d.value.trim()){$("#you").value=d.value.trim();savePrefs()}const n=$("#you").value.trim();
  if(!n){toast(t("m.need_name"));(d&&$("#dlg").open?d:$("#you")).focus();throw new Error("name")}return n}
const nameField=()=>$("#you").value.trim()||ST?"":`<div class="field wide"><label for="dlg_you">${esc(t("you.name"))}</label><input id="dlg_you" autocomplete="name"><div class="hint">${esc(t("you.name_hint"))}</div></div>`;
async function post(path,body){return api(path,{method:"POST",body:{...body,actor:actor()}})}
let toastT;function toast(m){const el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,5000)}

/* ---------- time and numbers ---------- */
function clockFor(){const c=CONF.clocks||{};if(!SYS||!TREE)return CONF.clock_all;
  const keys=SYS.startsWith("region:")?(TREE.regions.find(r=>r.key===SYS.slice(7))||{systems:[]}).systems.map(s=>s.key):[SYS];
  const v=keys.map(k=>c[k]).filter(Boolean);return v.length?Math.max(...v):CONF.clock_all}
function tzOf(){if(TREE&&SYS.startsWith("region:")){const r=TREE.regions.find(r=>r.key===SYS.slice(7));if(r)return r.timezone||"UTC"}if(!TREE)return "UTC";for(const r of TREE.regions)for(const s of r.systems)if(!SYS||s.key===SYS)return r.timezone||"UTC";return (TREE.regions[0]||{}).timezone||"UTC"}
function fmtT(ms,withDate){const d=new Date(ms),tz=tzOf(),now=CONF?CONF.clock_ms:Date.now();
  const same=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"});
  const showDate=withDate||same.format(d)!==same.format(new Date(now));
  return new Intl.DateTimeFormat(LANG==="vi"?"vi-VN":"en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",...(showDate?{day:"numeric",month:"short",...(Math.abs(now-ms)>300*86400e3?{year:"numeric"}:{})}:{})}).format(d)}
function fmtD(ms,monthOnly){return new Intl.DateTimeFormat(LANG==="vi"?"vi-VN":"en-GB",{timeZone:tzOf(),...(monthOnly?{month:"short",year:"2-digit"}:{day:"numeric",month:"short"})}).format(new Date(ms))}
function dur(s){s=Math.max(0,Math.round(s));const m=Math.round(s/60);if(m<60)return t("m.min",{n:m});const h=Math.floor(m/60);if(h<48)return t("m.h",{h,m:m%60});return t("m.d",{d:Math.floor(h/24),h:h%24})}
function show(x,v,q){if(v==null||!isFinite(v))return "—";
  if(x.quantity==="state"){if(q===2)return t("state.offline");const spill=/overflow|outfall/.test(x.site_type||"");return t(v>=0.5?(spill?"state.spilling":"state.on"):(spill?"state.not_spilling":"state.off"))}const d=x.display||{factor:1,offset:0,unit:x.unit};const y=(v-d.offset)/d.factor;const a=Math.abs(y);
  return (a>=1000?y.toFixed(0):a>=10?y.toFixed(1):y.toFixed(2))+" "+d.unit}
const disp=(x,v)=>v==null?null:(v-(x.display||{offset:0}).offset)/((x.display||{factor:1}).factor);

/* ---------- alerts text ---------- */
function alertText(a){if(!a.t||!a.p)return a.message;const p={...a.p};
  if(p.since!=null)p.since=fmtT(p.since*1000);if(p.level)p.level=t("lvl."+p.level);if(p.wk){p.why=t("why."+p.wk);p.check=t("check."+p.wk)}
  if(p.every_s)p.every=dur(p.every_s);return t("tpl."+a.t,p)}
const SEV_ICON={critical:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1l6.5 12h-13z" fill="currentColor"/></svg>',

    if(isOn){total+=b-a;if(!(i>0&&pts[i-1][1]>=0.5&&pts[i-1][2]!==2))count++}

    g+=`<text x="${L0-8}" y="${top+10}" text-anchor="end" font-size="11" fill="var(--water)">${esc(t("ch.rain"))}</text><text x="${L0-8}" y="${base}" text-anchor="end" font-size="10" fill="var(--muted)">${rmax.toFixed(1)} mm</text>`;
    rain.t.forEach((tt,i)=>{if(rv[i]<=0||tt<from||tt>to)return;const h=rv[i]/rmax*(base-top);g+=`<rect x="${X(tt).toFixed(1)}" y="${(base-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--water)" fill-opacity=".7"><title>${esc(fmtT(tt*1000,true))} · ${rv[i].toFixed(1)} mm</title></rect>`})}

function chartSVG(x,r,rain,from,to){

  const m=L.map(el).setView(c,isFinite(lat)?16:reg.lat!=null?12:2);if(CONF.map.tile_url)L.tileLayer(CONF.map.tile_url,{maxZoom:CONF.map.max_zoom||19,attribution:CONF.map.attribution}).addTo(m);else el.classList.add("blank");
  let mk=isFinite(lat)?L.marker(c).addTo(m):null;
  (MAPDATA?MAPDATA.sites:[]).forEach(s=>L.circleMarker([s.lat,s.lon],{radius:4,color:"#7f8c99",weight:1}).bindTooltip(s.name).addTo(m));
  m.on("click",e=>{f.lat.value=e.latlng.lat.toFixed(6);f.lon.value=e.latlng.lng.toFixed(6);if(mk)mk.setLatLng(e.latlng);else mk=L.marker(e.latlng).addTo(m)})}
function heightValue(f,name){const v=f[name]?f[name].value.trim():"";if(v==="")return null;const ref=f.querySelector(`[name="${name}__ref"]`).value;return ref==="above_datum"?+v.replace(",","."):{ref,value:+v.replace(",",".")}}
function sketch(f){const el=$("#sketch");if(!el)return;const num=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null};
  const g=num(f.ground_level_m.value);const h=(n,base)=>{const v=num(f[n].value),ref=f.querySelector(`[name="${n}__ref"]`).value;if(v==null)return null;if(ref==="above_datum")return v;
    if(ref==="below_ground")return g==null?null:g-v;if(ref==="above_floor")return base==null?null:base+v;return null};
  const fl=h("floor_level_m"),ov=h("overflow_level_m",fl);const ls=[["site.ground",g,"var(--earth)"],["site.floor",fl,"var(--ink)"],["site.overflow",ov,"var(--crit)"]].filter(x=>x[1]!=null);
  if(!ls.length){el.innerHTML="";return}const vs=ls.map(x=>x[1]),hi=Math.max(...vs)+1,lo=Math.min(...vs)-1,Y=v=>10+(hi-v)/(hi-lo)*140;
  el.innerHTML=`<svg viewBox="0 0 300 160" role="img" aria-label="${esc(t("setup.sketch"))}">${g!=null?`<rect x="0" y="${Y(g)}" width="300" height="${160-Y(g)}" fill="var(--earth)" fill-opacity=".25"/>`:""}
    ${fl!=null?`<rect x="90" y="${Y(Math.max(g??fl,ov??fl))}" width="80" height="${Y(fl)-Y(Math.max(g??fl,ov??fl))}" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>`:""}
    ${ls.map(([k,v,c])=>`<line x1="20" x2="240" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="4 3"/><text x="244" y="${Y(v)+4}" font-size="11" fill="${c}">${esc(t(k))} ${v.toFixed(2)}</text>`).join("")}</svg>`}
async function submitForm(f){
  const {kind,isNew,item}=FORM,data={key:f.key.value.trim()};
  for(const [name,type] of fieldsFor(kind,item)){
    if(type==="map"||type==="sketch")continue;
    if(type==="height"){if(kind==="sensor"&&f.querySelector('[data-height="mount_level_m"]').hidden)continue;const hv=heightValue(f,name);if(hv!=null||!isNew)data[name]=hv;continue}
    if(name==="area"){const a=f.area.value.trim();if(a){const fl=heightValue(f,"floor_level_m"),ov=heightValue(f,"overflow_level_m");data.area_curve_json=[[0,+a],[30,+a]]}continue}
    const el=f[name];if(!el)continue;let v=el.value;
    if(type==="number"||type==="coord")v=v.trim()===""?null:(type==="number"?+v.replace(",","."):v.trim());
    if(name==="component"&&v==="")v=null;
    if(isNew&&(v===""||v==null))continue;
    data[name]=v;
  }
  if(item.site&&kind!=="site")data.site=item.site;
  if(kind==="sensor"&&data.display_unit)data.limits_unit=data.display_unit;
  const box=$("#formProblems");box.innerHTML="";
  try{const r=await post("/api/setup",{action:"save",kind,data});
    $("#dlg").close();toast(r.pending?t("setup.proposed"):isNew?t("setup.saved_draft"):t("setup.saved"));
    if(r.warnings&&r.warnings.length)setTimeout(()=>toast(t("setup.notes")+" "+r.warnings.join(" · ")),600);
    await reloadTree();if(VIEW==="site"&&SITE)openSite(kind==="site"?data.key:SITE,true);else if(VIEW==="setup")showSetup();
  }catch(e){if(e.message==="name")return;const b=e.body||{};
    box.innerHTML=`<div class="problems"><strong>${esc(t("setup.not_saved"))}</strong><ul>${(b.problems||[e.message]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`+
      (b.warnings&&b.warnings.length?`<div class="problems warn"><strong>${esc(t("setup.notes"))}</strong><ul>${b.warnings.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:"");box.scrollIntoView({block:"nearest"})}
}

let SPILLS={days:30,sort:"spills"};
async function spillReport(days){
  let r=await api(`/api/spills?days=${days}${SYS&&!ST?"&system="+encodeURIComponent(SYS):""}`);
  if(ST&&SYS){const keep=x=>SYS.startsWith("region:")?x.region===SYS.slice(7):x.system===SYS;const rows=r.overflows.filter(keep);
    r={...r,overflows:rows,totals:{overflows:rows.length,spills:rows.reduce((a,x)=>a+x.spills,0),hours:Math.round(rows.reduce((a,x)=>a+x.hours,0)*10)/10,dry:rows.reduce((a,x)=>a+x.dry,0)}}}
  return r}
async function showSpills(){
  const el=$("#v-spills");el.innerHTML=`<div class="empty">${esc(t("m.loading"))}</div>`;
  let r;try{r=await spillReport(SPILLS.days)}catch(e){el.innerHTML=`<div class="empty">${esc(t("m.error",{e:e.message}))}</div>`;return}
  const st=fl("spills",{q:"",dry:false,water:"",sort:"spills",desc:true});
  const waters=[...new Set(r.overflows.map(x=>x.water).filter(Boolean))].sort();if(st.water&&!waters.includes(st.water))st.water="";
  const T=r.totals;
  const cols=[
    {k:"name",label:t("sp.c.overflow"),get:x=>x.name,html:x=>`<a href="#site-${esc(x.site)}">${esc(x.name)}</a>`},
    {k:"water",label:t("sp.c.water"),get:x=>x.water},
    {k:"spills",label:t("sp.c.spills"),get:x=>x.spills,sort:x=>x.spills*1e6+x.hours,num:true,desc:true},
    {k:"hours",label:t("sp.c.hours"),get:x=>x.hours,num:true,desc:true},
    {k:"dry",label:t("sp.c.dry"),get:x=>x.dry,csv:x=>x.rain_unknown===x.events&&!x.dry?"":x.dry,sort:x=>x.dry*1e3-(x.rain_unknown===x.events?1:0),num:true,desc:true,
      html:x=>x.dry?`<span class="chip critical">${x.dry}</span>`:x.rain_unknown===x.events?`<span class="small muted">${esc(t("sp.nogauge",{n:x.rain_unknown}))}</span>`:"0"},
    {k:"last",label:t("sp.c.last"),get:x=>fmtT(x.last_start*1000,true),sort:x=>x.last_start,desc:true,html:x=>`${esc(fmtT(x.last_start*1000,true))} · ${esc(dur(x.last_end-x.last_start))}`,cls:"small"}];
  listView(el,{view:"spills",st,cols,rows:r.overflows,go:x=>x.site,csvName:`spills-${SPILLS.days||"all"}d`,empty:t(r.overflows?"sp.none":"sp.no_overflows"),
    head:`<div class="row"><h2 style="margin:0">${esc(t("sp.title"))}</h2><span class="grow"></span><div class="ranges">${[7,30,365,0].map(d=>`<button class="btn small" data-days="${d}" aria-pressed="${SPILLS.days===d}">${esc(t("sp.p."+d))}</button>`).join("")}</div></div>
    <div class="counts" style="margin-top:10px"><span class="chip warning">${esc(t("sp.t.overflows",{n:T.overflows}))}</span><span class="chip warning">${esc(t("sp.t.spills",{n:T.spills}))}</span><span class="chip advisory">${esc(t("sp.t.hours",{n:T.hours}))}</span><span class="chip ${T.dry?"critical":"ok"}">${esc(t("sp.t.dry",{n:T.dry}))}</span></div>
    <details class="small muted" style="margin-bottom:8px"><summary>${esc(t("sp.how"))}</summary><p style="max-width:80ch">${esc(t("sp.method"))} ${esc(t("sp.caveat",{date:r.data_from?fmtT(r.data_from*1000,true):"—"}))}${r.complete_from?" "+esc(t("sp.complete",{date:fmtT(r.complete_from*1000,true)})):""}</p></details>`,
    controls:(waters.length>1?selF("water",st,[["",t("sp.any_water")],...waters.map(w=>[w,w])]):"")+chkF("dry",st,t("sp.dry_only")),
    filter:(x,st)=>hit(st.q,x.name,x.site,x.water)&&(!st.water||x.water===st.water)&&(!st.dry||x.dry>0)});
  el.querySelectorAll("[data-days]").forEach(b=>b.onclick=()=>{SPILLS.days=+b.dataset.days;showSpills()});
}

/* ---------- lists: search, filters, sorting, CSV ---------- */
const FL=lsGet("wwd.filters",{});
function fl(view,defaults){const o=FL[view]||(FL[view]={});for(const [k,v] of Object.entries(defaults))if(!(k in o))o[k]=v;o._d=defaults;return o}
function flSave(){const o={};for(const [k,v] of Object.entries(FL)){const {_d,...rest}=v;o[k]=rest}lsSet("wwd.filters",o)}
const fold=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const hit=(q,...f)=>{if(!q)return true;const h=fold(f.join(" "));return fold(q).split(/\s+/).filter(Boolean).every(w=>h.includes(w))};
const selF=(f,st,opts)=>`<select data-f="${f}" aria-label="${esc(opts[0][1])}">${opts.map(([v,l])=>`<option value="${esc(v)}"${String(st[f])===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
const chkF=(f,st,label)=>`<label class="small row"><input type="checkbox" data-f="${f}"${st[f]?" checked":""}> ${esc(label)}</label>`;
function sortRows(rows,cols,st){const c=cols.find(c=>c.k===st.sort)||cols[0],f=c.sort||c.get,d=st.desc?-1:1;
  return rows.map((x,i)=>[x,f(x),i]).sort((a,b)=>{const A=a[1],B=b[1];if(A==null||A==="")return B==null||B===""?a[2]-b[2]:1;if(B==null||B==="")return -1;return (A<B?-1:A>B?1:a[2]-b[2])*d}).map(r=>r[0])}
function downloadCSV(name,cols,rows){const q=v=>{v=String(v??"");return /[",\n;]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const txt=[cols.map(c=>q(c.label)).join(","),...rows.map(x=>cols.map(c=>q(c.csv?c.csv(x):c.get(x))).join(","))].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+txt],{type:"text/csv"}));a.download=name+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
/* A filterable, sortable table. Draws the bar once and redraws only the rows, so typing in the
   search box keeps its focus. */
function listView(el,{view,head="",cols,rows,st,controls="",filter,go,csvName,empty,page=300}){
  const filtered=()=>Object.keys(st._d).some(k=>k!=="sort"&&k!=="desc"&&String(st[k])!==String(st._d[k]));
  el.innerHTML=`<div class="panel">${head}<div class="filters row"><input type="search" data-q value="${esc(st.q||"")}" placeholder="${esc(t("fl.search"))}" aria-label="${esc(t("fl.search"))}">${controls}
    <span class="grow"></span><span class="small muted" data-count aria-live="polite"></span><button class="btn small" data-clear hidden>${esc(t("fl.clear"))}</button><button class="btn small" data-csv>${esc(t("fl.export"))}</button></div><div data-body></div></div>`;
  const body=el.querySelector("[data-body]");let shown=[],lim=page;
  function draw(){shown=sortRows(rows.filter(x=>filter(x,st)),cols,st);
    el.querySelector("[data-count]").textContent=t("fl.showing",{n:shown.length,total:rows.length});
    el.querySelector("[data-clear]").hidden=!filtered();
    body.innerHTML=shown.length?`<div class="tablewrap"><table class="list"><thead><tr>${cols.map(c=>`<th class="${c.num?"num":""}"${st.sort===c.k?` aria-sort="${st.desc?"descending":"ascending"}"`:""}>${c.nosort?esc(c.label):`<button class="sort" data-sort="${c.k}">${esc(c.label)}${st.sort===c.k?(st.desc?" ▾":" ▴"):""}</button>`}</th>`).join("")}</tr></thead>
      <tbody>${shown.slice(0,lim).map(x=>`<tr${go&&go(x)?` class="pick" data-go="${esc(go(x))}" tabindex="0"`:""}>${cols.map(c=>`<td class="${c.num?"num":""}${c.cls?" "+c.cls:""}">${c.html?c.html(x):esc(c.get(x)??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${shown.length>lim?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn small" data-more>${esc(t("fl.more",{n:shown.length-lim}))}</button></div>`:""}`
      :`<div class="empty">${esc(filtered()?t("fl.nothing"):empty||t("setup.none"))}</div>`;
    body.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(st.sort===k)st.desc=!st.desc;else{st.sort=k;st.desc=!!(cols.find(c=>c.k===k)||{}).desc}flSave();draw()});
    body.querySelectorAll("tr[data-go]").forEach(tr=>{tr.onclick=e=>{if(e.target.closest("a,button,input"))return;openSite(tr.dataset.go)};tr.onkeydown=e=>{if(e.key==="Enter"&&e.target===tr)openSite(tr.dataset.go)}});
    const m=body.querySelector("[data-more]");if(m)m.onclick=()=>{lim+=page*3;draw()}}
  el.querySelector("[data-q]").oninput=e=>{st.q=e.target.value;lim=page;flSave();draw()};
  el.querySelectorAll("[data-f]").forEach(c=>c.onchange=()=>{st[c.dataset.f]=c.type==="checkbox"?c.checked:c.value;lim=page;flSave();draw()});
  el.querySelector("[data-clear]").onclick=()=>{for(const k of Object.keys(st._d))if(k!=="sort"&&k!=="desc")st[k]=st._d[k];flSave();
    el.querySelector("[data-q]").value=st.q||"";el.querySelectorAll("[data-f]").forEach(c=>{if(c.type==="checkbox")c.checked=!!st[c.dataset.f];else c.value=st[c.dataset.f]});draw()};
  el.querySelector("[data-csv]").onclick=()=>downloadCSV(csvName,cols.filter(c=>!c.nocsv),shown);
  draw();return {draw}}

/* ---------- site state ---------- */
const RANK={critical:0,warning:1,advisory:2,offline:3,nodata:4,ok:5,draft:6};
const isOffline=s=>(s.readings||[]).some(r=>r.quality===2);
const hasData=s=>(s.readings||[]).some(r=>r.value!=null);
const isSpilling=s=>(s.readings||[]).some(r=>r.quantity==="state"&&r.quality!==2&&r.value>=.5);
function siteState(s){if(s.status!=="live")return "draft";if(s.worst)return s.worst;if(!hasData(s))return "nodata";if(isOffline(s))return "offline";return "ok"}
function stateHTML(s){const k=siteState(s);
  return (RANK[k]<3?sevChip(k):`<span class="chip ${k==="ok"?"ok":"draft"}">${esc(t("si.s."+k))}</span>`)
    +(isSpilling(s)?` <span class="chip warning">${esc(t("si.s.spilling"))}</span>`:"")+(isOffline(s)&&k!=="offline"?` <span class="chip draft">${esc(t("si.s.offline"))}</span>`:"")}
const stateText=s=>[t(RANK[siteState(s)]<3?"sev."+siteState(s):"si.s."+siteState(s)),isSpilling(s)?t("si.s.spilling"):"",isOffline(s)&&siteState(s)!=="offline"?t("si.s.offline"):""].filter(Boolean).join(", ");
function showMatch(s,show){return !show||(show==="attention"?s.status==="live"&&!!s.worst:show==="spilling"?isSpilling(s):show==="offline"?s.status==="live"&&(isOffline(s)||!hasData(s)):show==="ok"?siteState(s)==="ok":show==="draft"?s.status!=="live":true)}
const showOpts=()=>[["",t("ov.f.all")],["attention",t("ov.f.attention")],["spilling",t("ov.f.spilling")],["offline",t("ov.f.offline")],["ok",t("ov.f.ok")],["draft",t("ov.f.draft")]];
const lastTs=s=>{const v=Math.max(0,...(s.readings||[]).map(r=>r.ts||0));return v||null};
function readingText(s){const r=(s.readings||[]).find(r=>r.value!=null);return r?`${r.name}: ${show({...r,site_type:s.site_type},r.value,r.quality)}`:"—"}
const sysNames=()=>Object.fromEntries((TREE?TREE.regions:[]).flatMap(r=>r.systems.map(s=>[s.key,s.name])));
async function loadSites(){
  let d=await api("/api/map"+(SYS&&!ST?"?system="+encodeURIComponent(SYS):""));
  const pick=x=>!SYS||(SYS.startsWith("region:")?x.region===SYS.slice(7):x.system===SYS);
  if(ST&&SYS)d={sites:d.sites.filter(pick),layers:(d.layers||[]).filter(pick)};
  MAPDATA=d;return d}

/* ---------- sites ---------- */
async function showSites(){
  const el=$("#v-sites");el.innerHTML=`<div class="empty">${esc(t("m.loading"))}</div>`;
  const d=await loadSites(),names=sysNames(),now=CONF.clock_ms/1000;
  const types=[...new Set(d.sites.map(s=>s.site_type))].sort((a,b)=>t("st."+a).localeCompare(t("st."+b)));
  const systems=[...new Set(d.sites.map(s=>s.system))];
  const st=fl("sites",{q:"",show:"",type:"",system:"",sort:"state",desc:false});
  const cols=[
    {k:"name",label:t("si.c.name"),get:s=>s.name,html:s=>`<a href="#site-${esc(s.key)}">${esc(s.name)}</a><div class="small muted mono">${esc(s.key)}</div>`},
    {k:"type",label:t("si.c.type"),get:s=>t("st."+s.site_type)},
    {k:"system",label:t("si.c.system"),get:s=>names[s.system]||s.system},
    {k:"state",label:t("si.c.status"),get:stateText,sort:s=>RANK[siteState(s)],html:stateHTML},
    {k:"reading",label:t("si.c.reading"),get:readingText,nosort:true},
    {k:"age",label:t("si.c.age"),get:s=>lastTs(s)?fmtT(lastTs(s)*1000,true):"",sort:lastTs,html:s=>lastTs(s)?`<span title="${esc(fmtT(lastTs(s)*1000,true))}">${esc(t("si.ago",{d:dur(now-lastTs(s))}))}</span>`:"—",cls:"small"},
    {k:"crit",label:t("si.c.crit"),get:s=>s.criticality,num:true}];
  listView(el,{view:"sites",st,cols,rows:d.sites,go:s=>s.key,csvName:"sites",empty:t("ov.no_sites"),
    head:`<h2>${esc(t("si.title"))}</h2>`,
    controls:selF("show",st,showOpts())+selF("type",st,[["",t("fl.any_type")],...types.map(k=>[k,t("st."+k)])])
      +(systems.length>1?selF("system",st,[["",t("fl.any_system")],...systems.map(k=>[k,names[k]||k])]):""),
    filter:(s,st)=>hit(st.q,s.name,s.key,t("st."+s.site_type),names[s.system])&&showMatch(s,st.show)&&(!st.type||s.site_type===st.type)&&(!st.system||s.system===st.system)})
}

/* ---------- alerts ---------- */
const shelvedNow=a=>a.end_ms==null&&a.shelved_until_ms>Date.now();
async function alertsList(hours){
  const all=await api(`/api/alerts?${SYS?"system="+encodeURIComponent(SYS)+"&":""}ended_hours=${hours}&shelved=1`);
  return ST?all.filter(a=>!SYS||!a.system||(SYS.startsWith("region:")?a.region===SYS.slice(7):a.system===SYS)):all}
async function showAlerts(){
  const el=$("#v-alerts");if(!el.innerHTML)el.innerHTML=`<div class="empty">${esc(t("m.loading"))}</div>`;
  const all=await alertsList(168),now=CONF.clock_ms,week=now-7*864e5;
  const st=fl("alerts",{q:"",sev:"",state:"active",rule:"",sort:"sev",desc:false});
  const inState=(a,s)=>s==="all"?a.end_ms==null||a.end_ms>week:s==="active"?a.end_ms==null&&!shelvedNow(a):s==="unacked"?a.end_ms==null&&!a.ack_by&&!shelvedNow(a)
    :s==="acked"?a.end_ms==null&&!!a.ack_by:s==="shelved"?shelvedNow(a):a.end_ms!=null&&a.end_ms>week;
  const stateOf=a=>a.end_ms!=null?t("al.s.cleared",{time:fmtT(a.end_ms,true)}):shelvedNow(a)?t("al.s.shelved",{who:a.shelved_by||""}):a.ack_by?t("al.s.acked",{who:a.ack_by}):t("al.s.open");
  const rules=[...new Set(all.map(a=>a.rule))].sort();
  const cols=[
    {k:"sev",label:t("al.c.sev"),get:a=>t("sev."+a.severity),sort:a=>RANK[a.severity]*1e13-a.start_ms,html:a=>sevChip(a.severity)},
    {k:"site",label:t("al.c.site"),get:a=>a.site_name||"",html:a=>a.site?`<a href="#site-${esc(a.site)}">${esc(a.site_name)}</a><div class="small muted">${esc(a.system_name||"")}</div>`:esc(a.system_name||"—")},
    {k:"what",label:t("al.c.what"),get:a=>alertText(a),nosort:true,html:a=>`<div class="small muted">${esc(t("rule."+a.rule))}</div>${esc(alertText(a))}`,cls:"what"},
    {k:"start",label:t("al.c.start"),get:a=>fmtT(a.start_ms,true),sort:a=>a.start_ms,desc:true,cls:"small"},
    {k:"for",label:t("al.c.for"),get:a=>dur(((a.end_ms??now)-a.start_ms)/1000),sort:a=>(a.end_ms??now)-a.start_ms,desc:true,num:true,cls:"small"},
    {k:"state",label:t("al.c.state"),get:stateOf,sort:a=>a.end_ms!=null?3:shelvedNow(a)?2:a.ack_by?1:0,cls:"small"}];
  if(!ST)cols.push({k:"acts",label:"",nosort:true,nocsv:true,get:()=>"",html:a=>a.end_ms!=null?"":`<div class="acts">${a.ack_by?"":`<button class="btn small" data-ack="${a.id}">${esc(t("al.ack"))}</button>`}${shelvedNow(a)?`<button class="btn small" data-unshelve="${a.id}">${esc(t("al.unshelve"))}</button>`:`<button class="btn small" data-shelve="${a.id}">${esc(t("al.shelve"))}</button>`}</div>`});
  listView(el,{view:"alerts",st,cols,rows:all,go:a=>a.site,csvName:"alerts",empty:t("ov.none"),
    head:`<h2>${esc(t("al.title"))}</h2>`,
    controls:selF("state",st,[["active",t("al.st.active")],["unacked",t("al.st.unacked")],["acked",t("al.st.acked")],["shelved",t("al.st.shelved")],["cleared",t("al.st.cleared")],["all",t("al.st.all")]])
      +selF("sev",st,[["",t("fl.any_sev")],...["critical","warning","advisory"].map(s=>[s,t("sev."+s)])])
      +selF("rule",st,[["",t("fl.any_rule")],...rules.map(r=>[r,t("rule."+r)])]),
    filter:(a,st)=>inState(a,st.state)&&(!st.sev||a.severity===st.sev)&&(!st.rule||a.rule===st.rule)&&hit(st.q,a.site_name,a.site,a.system_name,alertText(a),t("rule."+a.rule))})
}
function goAlerts(sev){const st=fl("alerts",{q:"",sev:"",state:"active",rule:"",sort:"sev",desc:false});Object.assign(st,{q:"",rule:"",state:"active",sev:sev||""});flSave();setView("alerts");render()}

/* ---------- find a site (header) ---------- */
function setupFind(){
  const inp=$("#find"),list=$("#findList");let res=[],cur=0;
  const close=()=>{list.hidden=true;inp.setAttribute("aria-expanded","false")};
  const draw=()=>{const q=inp.value.trim();if(!q||!MAPDATA){close();return}
    res=MAPDATA.sites.filter(s=>hit(q,s.name,s.key,t("st."+s.site_type))).sort((a,b)=>(fold(a.name).startsWith(fold(q))?0:1)-(fold(b.name).startsWith(fold(q))?0:1)||a.name.localeCompare(b.name)).slice(0,8);cur=0;
    list.innerHTML=res.length?res.map((s,i)=>`<button type="button" role="option" data-find="${esc(s.key)}" aria-selected="${i===cur}"><span>${esc(s.name)}<span class="small muted"> · ${esc(t("st."+s.site_type))}</span></span>${RANK[siteState(s)]<3?sevChip(siteState(s)):""}</button>`).join(""):`<div class="small muted" style="padding:8px 10px">${esc(t("find.none"))}</div>`;
    list.hidden=false;inp.setAttribute("aria-expanded","true")};
  const pick=k=>{inp.value="";close();inp.blur();openSite(k)};
  inp.oninput=async()=>{if(!MAPDATA)await loadSites();draw()};
  inp.onkeydown=e=>{const b=[...list.querySelectorAll("[data-find]")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!b.length)return;cur=(cur+(e.key==="ArrowDown"?1:b.length-1))%b.length;b.forEach((x,i)=>x.setAttribute("aria-selected",i===cur))}
    else if(e.key==="Enter"&&res[cur]){e.preventDefault();pick(res[cur].key)}else if(e.key==="Escape"){inp.value="";close();inp.blur()}};
  list.onmousedown=e=>{const b=e.target.closest("[data-find]");if(b){e.preventDefault();pick(b.dataset.find)}};
  inp.onblur=()=>setTimeout(close,150);
  document.addEventListener("keydown",e=>{if(e.key==="/"&&!e.target.closest("input,textarea,select,dialog")){e.preventDefault();const q=document.querySelector("section:not([hidden]) [data-q]");(q||inp).focus()}});
}

/* ---------- views and start-up ---------- */
const hashSite=()=>{const h=decodeURIComponent(location.hash.slice(1));return h.startsWith("site-")?h.slice(5):h.startsWith("site=")?h.slice(5):null};
function setView(v){VIEW=v;if(v!=="site"&&location.hash)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}for(const s of ["overview","site","alerts","sites","spills","setup","log"])$("#v-"+s).hidden=s!==v;$$("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===(v==="site"?PREV:v)?"page":"false"));
  if(v==="overview"&&map)setTimeout(()=>map.invalidateSize(),50)}
async function render(){if(VIEW==="overview")await showOverview();else if(VIEW==="site")await openSite(SITE,true);else if(VIEW==="alerts")await showAlerts();else if(VIEW==="sites")await showSites();else if(VIEW==="spills")await showSpills();else if(VIEW==="setup")await showSetup();else await showLog()}
async function reloadTree(){TREE=await api("/api/tree");const sel=$("#sysPick");
  sel.innerHTML=(TREE.regions.length>1?"":`<option value="">${esc(t("sys.all"))}</option>`)+TREE.regions.map(r=>`<optgroup label="${esc(r.name)}">${r.systems.length>1||TREE.regions.length>1?`<option value="region:${esc(r.key)}">${esc(t("sys.all_in",{name:r.name}))}</option>`:""}${r.systems.map(s=>`<option value="${esc(s.key)}">${esc(s.name)} · ${esc(t("nt."+s.network_type))}</option>`).join("")}</optgroup>`).join("");
  if(!SYS&&TREE.regions.length>1){const d=CONF.default_system;SYS=d&&[...sel.options].some(o=>o.value===d)?d:"region:"+TREE.regions[0].key}
  if(![...sel.options].some(o=>o.value===SYS))SYS="";sel.value=SYS}
function savePrefs(){lsSet("wwd.prefs",{lang:LANG,sys:SYS,name:$("#you").value})}
async function start(){
  CONF=await api("/api/config");if(ST)Object.assign(CONF,{static:true});CONF.clock_all=CONF.clock_ms;
  await loadLang(prefs.lang||CONF.language||"en");
  $("#lang").value=LANG;$("#title").textContent=CONF.title;document.title=CONF.title+(ST?" · demo":"");
  $("#you").value=prefs.name||"";$("#pass").hidden=!CONF.write_protected||!!ST;if(ST){$("#you").hidden=true}
  applyWords();await reloadTree();CONF.clock_ms=clockFor();
  const banners=()=>{if(ST||CONF.clock_mode!=="now"){$("#clock").textContent=t("clock.judged",{time:fmtT(CONF.clock_ms,true)})}
    if(ST){$("#demo").hidden=false;$("#demo").textContent=t("demo.banner",{time:fmtT(CONF.clock_ms,true)})}};banners();
  $("#foot").innerHTML=`Waterworks Desk ${esc(CONF.version)}${(CONF.credits||[]).length?" · "+esc(t("credits"))+": "+CONF.credits.map(c=>c.url?`<a href="${esc(c.url)}" rel="noopener">${esc(c.text)}</a>`:esc(c.text)).join(" · "):""}`;
  $$("nav.tabs button").forEach(b=>b.onclick=()=>{setView(b.dataset.view);render()});
  $("#sysPick").onchange=e=>{SYS=e.target.value;savePrefs();CONF.clock_ms=clockFor();banners();if(VIEW==="site")setView("overview");render()};
  $("#lang").onchange=async e=>{await loadLang(e.target.value);savePrefs();applyWords();banners();await reloadTree();$("#find").placeholder=t("find.ph");
    render()};
  $("#you").onchange=savePrefs;setupFind();$("#find").placeholder=t("find.ph");
  const hs=hashSite();if(hs){await openSite(hs)}else{setView("overview");await render()}
  window.addEventListener("hashchange",()=>{const k=hashSite();if(k&&(k!==SITE||VIEW!=="site"))openSite(k)});
  if(!ST)setInterval(()=>{if($("#dlg").open||document.activeElement&&document.activeElement.matches("input,select"))return;
    if(VIEW==="overview")refreshAlerts().catch(()=>{});else if(VIEW==="alerts")showAlerts().catch(()=>{})},60000);
}
start().catch(e=>{document.querySelector("main").innerHTML=`<div class="empty">Couldn't start: ${esc(e.message)}</div>`});
})();
</script>
